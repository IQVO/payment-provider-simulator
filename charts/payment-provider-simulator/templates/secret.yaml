{{- if and (not .Values.database.existingSecret) (or .Values.database.url .Values.database.migrationsUrl) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "payment-provider-simulator.databaseSecretName" . }}
  labels:
    {{- include "payment-provider-simulator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.database.url }}
  {{ $.Values.database.existingSecretKey }}: {{ . | quote }}
  {{- end }}
  {{- if and .Values.database.migrationsUrl .Values.database.migrationsExistingSecretKey }}
  {{ .Values.database.migrationsExistingSecretKey }}: {{ .Values.database.migrationsUrl | quote }}
  {{- end }}
{{- end }}
