# Default values for payment-provider-simulator. One component: the api
# Deployment (cmd/api: REST only - the simulator publishes and consumes no
# events (ADR 0002 A16), so there is no Kafka, no outbox relay and no
# consumer). The chart refuses to render without the mandatory value below
# (named in the failure): database.*.

replicaCount: 1

# The image is built from this repository's Dockerfile (ENTRYPOINT ./api,
# user 1000, port 8080, root filesystem never written).
image:
  repository: warehouse/payment-provider-simulator
  pullPolicy: IfNotPresent
  # Empty = "v" + the chart's appVersion (the release job tags the image v<version>).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid/gid 1000 (Dockerfile USER 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Optional exposure, default off. Both route to the api Service only.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: payment-provider-simulator.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2), default off. When enabled the
# Deployment omits replicas so the HPA owns them. N>1 is safe: every write is
# a plain Postgres transaction and the scenario tokens are deterministic; it
# has not been load-tested.
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api (cmd/api/config.go, cmd/api/main.go). Every key
# maps 1:1 to one variable; nothing else is rendered.
config:
  httpAddr: ":8080"                    # HTTP_ADDR (its port must equal service.targetPort)
  logLevel: "info"                     # LOG_LEVEL: debug | info | warn (or warning) | error
  # PROVIDER_TIMEOUT_DELAY: Go duration, the stall of a timeout-scenario
  # authorization before its 504. Empty = not rendered; the binary defaults to
  # 1s and caps at 2s.
  providerTimeoutDelay: ""
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before the listener closes.
  # Empty = not rendered (the binary defaults to 5s). Whole seconds ("5s"),
  # minutes ("1m") or "0"; the chart needs the number to size the grace period.
  shutdownDrainDelay: ""

# The chart refuses to render unless database.url or database.existingSecret is
# set. DATABASE_URL always comes from a Secret (secretKeyRef), never from the
# ConfigMap.
database:
  # A DSN the chart stores in a Secret it creates. Prefer existingSecret.
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same Secret, of a DIRECT (non-pooled, session-mode) DSN used only
  # for the boot migrations (MIGRATIONS_DATABASE_URL), `optional: true` so a
  # Secret without it still starts the pod (the binary falls back to
  # DATABASE_URL). With database.url set, migrationsUrl fills it.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"
  migrationsUrl: ""

# Extra env vars appended to the api container as a raw list. The chart refuses
# any *_MODE variable (this service has no mode: Postgres is the only runtime),
# any *_CONSUMER_GROUP variable (this service runs no consumer) and any
# variable the chart renders itself.
# Observability (the fleet standard): OTLP traces and metrics from the api.
# SERVICE_VERSION is the image tag (appVersion when empty); ENVIRONMENT comes
# from `environment` below. extraEnv may not set these names.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "payment-provider-simulator"

# ENVIRONMENT of the api: deployment.environment.name on every span, metric
# and log line.
environment: "production"

extraEnv: []

# The Postgres dial and the migrations at boot run inside a bounded retry
# (internal/bootretry), so the startup probe allows ~60s.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Room for the binary's sequential graceful shutdown (cmd/api/main.go):
# /readyz flips, SHUTDOWN_DRAIN_DELAY passes (5s), then the HTTP drain bounded
# at 10s, plus a 10s buffer = 25s worst case. The chart refuses anything that
# does not exceed that sum for the configured drain delay (a shorter period
# SIGKILLs an in-flight request mid-drain).
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
