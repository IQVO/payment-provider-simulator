openapi: 3.0.3
info:
  title: Payment Provider Simulator API
  version: 1.0.0
  contact:
    name: payment-provider-simulator maintainers
    url: https://github.com/IQVO/payment-provider-simulator
  description: >-
    Go stand-in for the external payment provider of the digital storefront. It
    implements exactly the provider contract customer-payments documents in its
    ADR 0002 assumption A12. Every POST carries an Idempotency-Key header and the
    same key returns the same answer; bodies are JSON, amounts are integer minor
    units, and only PSP tokens travel, never a card number. A 4xx decline is
    final (402 with a code); 5xx and 504 are transient. Outcomes are
    deterministic: a payment-method token names its test scenario. Scenario
    vocabulary (POST /tokens issues tok_<scenario>_<suffix>; the bare literals
    tok_approve, tok_decline, tok_timeout and tok_expire-early also work).
    approve - authorizes, the hold lasts 7 days. decline - every authorization
    answers 402 CARD_DECLINED. timeout - the authorization answers 504 after a
    short delay (at most 2 s). expire-early - authorizes, the hold lasts 5
    minutes, so re-authorization before expiry is testable; a re-authorized
    expire-early hold keeps the 5 minute validity. Errors are RFC 9457 problem
    details (application/problem+json) whose type is /problems/<slug>: malformed-request,
    idempotency-key-required, idempotency-key-invalid, resource-not-found (a NUL in the path),
    not-found, payment-declined, validation-failed, not-a-reduction, idempotency-key-reused,
    illegal-transition, over-capture, over-refund, hold-expired, provider-timeout,
    dependency-unavailable, internal-error. No authentication.
servers:
  - url: http://localhost:8080
tags:
  - name: Tokens
    description: Hosted-fields stand-in that issues payment-method tokens.
  - name: Authorizations
    description: Holds and the captures, refunds and releases taken against them.
  - name: Platform
    description: Liveness and readiness.
paths:
  /tokens:
    post:
      tags: [Tokens]
      operationId: issueToken
      summary: Issue a payment-method token for a test scenario
      description: >-
        IssueToken. The body is optional; it names the scenario (approve, decline,
        timeout, expire-early; absent or empty means approve). The same Idempotency-Key returns the
        same token.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              decline:
                summary: A token that is always declined
                value: {scenario: decline}
              expireEarly:
                summary: A token whose holds last five minutes
                value: {scenario: expire-early}
      responses:
        '201':
          description: The token.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              example: {token: tok_expire-early_3fa85f64c1d2, scenario: expire-early}
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /authorizations:
    post:
      tags: [Authorizations]
      operationId: authorize
      summary: Place a hold on the payment method a token stands for
      description: >-
        Authorize. approve and expire-early tokens answer 201 with the hold id and
        its expiry; a decline token answers 402 payment-declined with the decline
        code (final); a timeout token answers 504 provider-timeout after a short
        delay (transient, retry with the same key; the timeout scenario is answered
        before the Idempotency-Key is claimed, so it is never stored or replayed,
        and its body is not validated). A card number or an unrecognised token is
        a 422 validation-failed. A decline token only checks that amountMinor is
        positive.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
            example: {amountMinor: 10000, currency: BRL, paymentMethodToken: tok_approve, reference: cs-1}
      responses:
        '201':
          description: The hold.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
              example: {id: hold_3fa85f64c1d2, expiresAt: '2026-11-02T09:00:00Z', amountMinor: 10000, currency: BRL}
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: payment-declined; the code is an extension member (CARD_DECLINED). A stored decline is replayed with the same status.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: {type: /problems/payment-declined, title: The payment provider declined the authorization, status: 402, detail: 'the payment method was declined: CARD_DECLINED', instance: /authorizations, code: CARD_DECLINED}
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '504':
          description: provider-timeout (the timeout scenario); never replayed, the key is not claimed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /authorizations/{id}:
    get:
      tags: [Authorizations]
      operationId: getAuthorization
      summary: Read a hold with its captures and refunds
      description: GetAuthorization. A test aid; the real provider shows the same in its dashboard.
      parameters:
        - $ref: '#/components/parameters/HoldId'
      responses:
        '200':
          description: The hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /authorizations/{id}/voids:
    post:
      tags: [Authorizations]
      operationId: voidAuthorization
      summary: Release the whole remaining hold
      description: Void. A hold that is not AUTHORIZED (voided, fully captured or superseded) is 409 illegal-transition.
      parameters:
        - $ref: '#/components/parameters/HoldId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        description: No body is expected; an empty body or an empty object is accepted, any member is 400 malformed-request.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /authorizations/{id}/reauthorizations:
    post:
      tags: [Authorizations]
      operationId: reauthorize
      summary: Replace the hold by a fresh one of the given amount
      description: >-
        Reauthorize. The old hold becomes SUPERSEDED and the answer is the NEW
        hold (new id, new expiry). The scenario of the token is kept, so an
        expire-early hold is renewed for another five minutes. amountMinor must be
        positive (422); a hold that is not AUTHORIZED is 409 illegal-transition.
      parameters:
        - $ref: '#/components/parameters/HoldId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '201':
          description: The new hold.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /authorizations/{id}/reductions:
    post:
      tags: [Authorizations]
      operationId: reduceAuthorization
      summary: Lower the remaining hold (partial release)
      description: >-
        Reduce. amountMinor is the new REMAINING hold (0 or more); it never raises
        it (not-a-reduction, 422). Reducing to zero closes the hold (VOIDED when
        nothing was captured, otherwise CAPTURED). A hold that is not AUTHORIZED is
        409 illegal-transition.
      parameters:
        - $ref: '#/components/parameters/HoldId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /authorizations/{id}/captures:
    post:
      tags: [Authorizations]
      operationId: capture
      summary: Take money from the hold
      description: >-
        Capture. amountMinor must be positive (422). Partial captures accumulate;
        over-capture, hold-expired and illegal-transition (hold not AUTHORIZED) are
        409; hold-expired is checked before the amount.
      parameters:
        - $ref: '#/components/parameters/HoldId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '201':
          $ref: '#/components/responses/Movement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /authorizations/{id}/refunds:
    post:
      tags: [Authorizations]
      operationId: refund
      summary: Return captured money
      description: Refund. amountMinor must be positive (422). Refunds never exceed the captured total (over-refund, 409); a refund is accepted in any hold state.
      parameters:
        - $ref: '#/components/parameters/HoldId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '201':
          $ref: '#/components/responses/Movement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /healthz:
    get:
      tags: [Platform]
      operationId: healthz
      summary: Liveness
      description: Always 200 {status ok} while the process runs.
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      tags: [Platform]
      operationId: readyz
      summary: Readiness
      description: 200 while Postgres answers a ping (cached for 3 s) and the process is not draining; 503 otherwise.
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Draining (application/json, status not_ready) or Postgres is unavailable (problem dependency-unavailable, the detail names the failing dependency).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example: {status: not_ready}
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A client-generated key per logical submit (a retry reuses it); 1-128
        printable ASCII characters, sent once (a UUID is conventional but not
        required). Missing is 400 idempotency-key-required; empty-invalid, repeated
        or non-printable is 400 idempotency-key-invalid. The key is global across
        operations: a repeated key with the same operation and inputs replays the
        stored answer with Idempotency-Replayed true; the same key with another
        operation or other inputs is 409 idempotency-key-reused. A failed request
        leaves no claim behind, so its key can be retried.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[ -~]{1,128}$'
    HoldId:
      name: id
      in: path
      required: true
      description: The hold id returned by authorize or reauthorize.
      schema:
        type: string
  headers:
    IdempotencyReplayed:
      description: Present, with the value true, only when the answer is the stored replay of an earlier request with the same Idempotency-Key.
      schema:
        type: string
        enum: ['true']
  requestBodies:
    Amount:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AmountRequest'
          example: {amountMinor: 2500}
  responses:
    Done:
      description: The operation took effect.
      headers:
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Done'
    Movement:
      description: The capture or refund.
      headers:
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Movement'
    BadRequest:
      description: >-
        malformed-request (unparseable or empty JSON, an unknown member, trailing
        data, a body over 64 KiB, or a NUL in the query or body),
        idempotency-key-required or idempotency-key-invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotencyKeyRequired:
              summary: The Idempotency-Key header is missing
              value: {type: /problems/idempotency-key-required, title: Idempotency-Key header is required, status: 400, detail: the Idempotency-Key header is required on this operation, instance: /authorizations}
    NotFound:
      description: not-found (no such hold), or resource-not-found when the path contains a NUL.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        idempotency-key-reused (the key was first used with a different method,
        path or body), illegal-transition, over-capture, over-refund or
        hold-expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotencyKeyReused:
              summary: The Idempotency-Key was first used with a different request
              value: {type: /problems/idempotency-key-reused, title: Idempotency-Key was already used with a different request, status: 409, detail: Idempotency-Key was already used with a different request, instance: /authorizations}
    Unprocessable:
      description: validation-failed (bad scenario, amount or currency, empty reference, card number or unrecognised payment-method value) or not-a-reduction.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri-reference
          description: /problems/<slug>, for example /problems/over-refund. The slug list is in the API description.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Always present; for internal-error it is a fixed generic message.
        instance:
          type: string
          format: uri-reference
          description: Always present; the escaped request path.
        code:
          type: string
          description: The provider decline code (payment-declined only).
          example: CARD_DECLINED
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: ok (healthz), ready or not_ready (readyz).
          enum: [ok, ready, not_ready]
          example: ready
    Scenario:
      type: string
      description: The deterministic behaviour a token selects.
      enum: [approve, decline, timeout, expire-early]
    TokenRequest:
      type: object
      additionalProperties: false
      properties:
        scenario:
          $ref: '#/components/schemas/Scenario'
    Token:
      type: object
      required: [token, scenario]
      properties:
        token:
          type: string
          description: tok_<scenario>_<suffix>.
        scenario:
          $ref: '#/components/schemas/Scenario'
    AuthorizeRequest:
      type: object
      additionalProperties: false
      required: [amountMinor, currency, paymentMethodToken, reference]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        paymentMethodToken:
          type: string
          description: A PSP token; never a card number.
        reference:
          type: string
          minLength: 1
          description: The caller's reference, for example the checkout session id. Required and non-empty for approve and expire-early tokens.
    AmountRequest:
      type: object
      additionalProperties: false
      required: [amountMinor]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          description: The amount in minor units; positive for capture, refund and reauthorize (422 otherwise); for a reduction the new remaining hold, 0 or more.
    Hold:
      type: object
      required: [id, expiresAt, amountMinor, currency]
      properties:
        id:
          type: string
        expiresAt:
          type: string
          format: date-time
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
    Movement:
      type: object
      required: [id, amountMinor, currency]
      properties:
        id:
          type: string
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
    Done:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: The hold the operation applied to.
    HoldDetail:
      type: object
      required: [id, status, scenario, reference, currency, heldMinor, capturedMinor, refundedMinor, remainingMinor, expiresAt, createdAt, movements]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [AUTHORIZED, CAPTURED, VOIDED, SUPERSEDED]
        scenario:
          $ref: '#/components/schemas/Scenario'
        reference:
          type: string
        currency:
          type: string
        heldMinor:
          type: integer
          format: int64
        capturedMinor:
          type: integer
          format: int64
        refundedMinor:
          type: integer
          format: int64
        remainingMinor:
          type: integer
          format: int64
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        supersededBy:
          type: string
          description: The id of the replacing hold; present only when status is SUPERSEDED.
        movements:
          type: array
          items:
            $ref: '#/components/schemas/MovementEntry'
    MovementEntry:
      type: object
      required: [id, kind, amountMinor, at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [CAPTURE, REFUND]
        amountMinor:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
